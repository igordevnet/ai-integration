spring:
  application:
    name: multi-model-agent

  ai:
    openai:
      api-key: ${OPENAI_SECRET_KEY:}

    ollama:
      chat:
        model: llama3.2

    chat:
      client:
        enabled: false

      memory:
        repository:
          jdbc:
            initialize-schema: always

  datasource:
    url: jdbc:h2:file:~/chatmemory;AUTO_SERVER=true
    driver-class-name: org.h2.Driver
    username: igor
    password: 123

logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
  org.springframework.ai.chat.memory.repository.jdbc: DEBUG
  org.springframework.jdbc.datasource.init: DEBUG


custom:
  openai:
    model: gpt-5.4-mini
    temperature: 0.8
    maxTokens: 2000
    frequencyPenalty: 0.3
    presencePenalty: 0.4
    topP: 1.0
    topK: 0
    stopSequences: []